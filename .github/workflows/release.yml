# Builds native installers (.dmg / .exe / .deb / .rpm) AND per-OS
# distribution JARs on 3 OS runners, then publishes them all as GitHub
# Release assets whenever a v* tag is pushed.
#
# Usage:
#   git tag v1.0.1
#   git push origin v1.0.1
#
# Artifacts are renamed to stable, version-less filenames so the README can
# link releases/latest/download/conload.dmg etc. without breaking on bumps.
#
# Requirements satisfied by the runners:
#   - Liberica JDK 21 (jdk+fx) — bundles JavaFX modules so jpackage
#     --add-modules=javafx.* works without a separate JavaFX install.
#   - Maven is preinstalled on GitHub-hosted runners.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS .dmg + JAR
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Liberica JDK 21 (JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx
      - name: Build installer
        run: ./build-mac.sh
      - name: Rename installer to stable asset name
        run: |
          mv target/installer/conload-*.dmg target/installer/conload.dmg
      - name: Build distribution JAR
        run: |
          mvn -DskipTests package -Pmac -q
          mv target/conload-1.0.1-mac.jar target/conload-mac.jar
      - uses: actions/upload-artifact@v4
        with:
          name: conload-mac-dmg
          path: target/installer/conload.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: conload-mac-jar
          path: target/conload-mac.jar
          if-no-files-found: error

  build-windows:
    name: Build Windows .exe + JAR
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Liberica JDK 21 (JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx
      # Inline build using bash (Git Bash on Windows runners) — avoids
      # .bat CRLF line-ending issues entirely.
      - name: Build installer
        shell: bash
        run: |
          mvn clean package -Pnative -DskipTests -q
          jpackage \
            --input target/libs \
            --main-jar conload-1.0.1.jar \
            --main-class com.conload.App \
            --name conload \
            --app-version 1.0.1 \
            --description "Download Confluence and Jira pages as Markdown for AI/Copilot context" \
            --vendor "conload" \
            --dest target/installer \
            --type exe \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --java-options "--add-modules=javafx.controls,javafx.fxml,javafx.graphics,javafx.base" \
            --java-options "--add-reads=com.conload=ALL-UNNAMED" \
            --java-options "-Xmx512m"
      - name: Rename installer to stable asset name
        shell: bash
        run: |
          mv target/installer/conload-*.exe target/installer/conload.exe
      - name: Build distribution JAR
        shell: bash
        run: |
          mvn -DskipTests package -Pwindows -q
          mv target/conload-1.0.1-windows.jar target/conload-windows.jar
      - uses: actions/upload-artifact@v4
        with:
          name: conload-windows-exe
          path: target/installer/conload.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: conload-windows-jar
          path: target/conload-windows.jar
          if-no-files-found: error

  build-linux:
    name: Build Linux .deb + .rpm + JARs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Liberica JDK 21 (JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx
      - name: Install rpm toolchain (for .rpm type)
        run: sudo apt-get update && sudo apt-get install -y rpm
      # Build both .deb and .rpm in one pass — the script builds the JAR
      # once, then runs jpackage for each type (avoids mvn clean wiping
      # the first installers when the second type is built).
      - name: Build .deb and .rpm installers
        run: ./build-linux.sh deb rpm
      - name: Rename installers to stable asset names
        run: |
          mv target/installer/conload_*.deb target/installer/conload.deb
          mv target/installer/conload-*.rpm target/installer/conload.rpm
      - name: Build distribution JAR
        run: |
          mvn -DskipTests package -Plinux -q
          mv target/conload-1.0.1-linux.jar target/conload-linux.jar
      - uses: actions/upload-artifact@v4
        with:
          name: conload-linux-deb
          path: target/installer/conload.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: conload-linux-rpm
          path: target/installer/conload.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: conload-linux-jar
          path: target/conload-linux.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*

# The Homebrew formula sync lives in .github/workflows/update-formula.yml
# (separate workflow, triggered when this release is published).
