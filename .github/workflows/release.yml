# Builds native installers (.dmg / .exe / .deb / .rpm) AND per-OS
# distribution JARs on 3 OS runners, then publishes them all as GitHub
# Release assets whenever a v* tag is pushed. Finally, the update-formula
# job pushes the regenerated Homebrew formula to soft-am/homebrew-tap
# (install: brew install soft-am/tap/conload).
#
# Usage:
#   git tag v1.0.1
#   git push origin v1.0.1
#
# Artifacts are renamed to stable, version-less filenames so the README can
# link releases/latest/download/conload.dmg etc. without breaking on bumps.
#
# Requirements satisfied by the runners:
#   - Liberica JDK 21 (jdk+fx) — bundles JavaFX modules so jpackage
#     --add-modules=javafx.* works without a separate JavaFX install.
#   - Maven is preinstalled on GitHub-hosted runners.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS .dmg + JAR
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Liberica JDK 21 (JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx
      - name: Build installer
        run: ./build-mac.sh
      - name: Rename installer to stable asset name
        run: |
          mv target/installer/conload-*.dmg target/installer/conload.dmg
      - name: Build distribution JAR
        run: |
          mvn -DskipTests package -Pmac -q
          mv target/conload-1.0.1-mac.jar target/conload-mac.jar
      - uses: actions/upload-artifact@v4
        with:
          name: conload-mac-dmg
          path: target/installer/conload.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: conload-mac-jar
          path: target/conload-mac.jar
          if-no-files-found: error

  build-windows:
    name: Build Windows .exe + JAR
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Liberica JDK 21 (JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx
      # Inline build using bash (Git Bash on Windows runners) — avoids
      # .bat CRLF line-ending issues entirely.
      - name: Build installer
        shell: bash
        run: |
          mvn clean package -Pnative -DskipTests -q
          jpackage \
            --input target/libs \
            --main-jar conload-1.0.1.jar \
            --main-class com.conload.App \
            --name conload \
            --app-version 1.0.1 \
            --description "Download Confluence and Jira pages as Markdown for AI/Copilot context" \
            --vendor "conload" \
            --dest target/installer \
            --type exe \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --java-options "--add-modules=javafx.controls,javafx.fxml,javafx.graphics,javafx.base" \
            --java-options "--add-reads=com.conload=ALL-UNNAMED" \
            --java-options "-Xmx512m"
      - name: Rename installer to stable asset name
        shell: bash
        run: |
          mv target/installer/conload-*.exe target/installer/conload.exe
      - name: Build distribution JAR
        shell: bash
        run: |
          mvn -DskipTests package -Pwindows -q
          mv target/conload-1.0.1-windows.jar target/conload-windows.jar
      - uses: actions/upload-artifact@v4
        with:
          name: conload-windows-exe
          path: target/installer/conload.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: conload-windows-jar
          path: target/conload-windows.jar
          if-no-files-found: error

  build-linux:
    name: Build Linux .deb + .rpm + JARs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Liberica JDK 21 (JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx
      - name: Install rpm toolchain (for .rpm type)
        run: sudo apt-get update && sudo apt-get install -y rpm
      # Build both .deb and .rpm in one pass — the script builds the JAR
      # once, then runs jpackage for each type (avoids mvn clean wiping
      # the first installers when the second type is built).
      - name: Build .deb and .rpm installers
        run: ./build-linux.sh deb rpm
      - name: Rename installers to stable asset names
        run: |
          mv target/installer/conload_*.deb target/installer/conload.deb
          mv target/installer/conload-*.rpm target/installer/conload.rpm
      - name: Build distribution JAR
        run: |
          mvn -DskipTests package -Plinux -q
          mv target/conload-1.0.1-linux.jar target/conload-linux.jar
      - uses: actions/upload-artifact@v4
        with:
          name: conload-linux-deb
          path: target/installer/conload.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: conload-linux-rpm
          path: target/installer/conload.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: conload-linux-jar
          path: target/conload-linux.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*

  # Regenerates the Homebrew formula and pushes it to the public tap
  # repository soft-am/homebrew-tap (single source of truth for the formula).
  # Substitutes version + sha256 of the published conload-mac.jar /
  # conload-linux.jar from this release into Formula/conload.rb.template.
  # Requires the HOMEBREW_TAP_TOKEN repo secret (fine-grained PAT with
  # Contents: Read and write on soft-am/homebrew-tap only).
  # Users install with:  brew install soft-am/tap/conload
  update-formula:
    name: Update Homebrew tap formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download JARs from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p /tmp/jars
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p "conload-mac.jar" -p "conload-linux.jar" -D /tmp/jars
      - name: Compute sha256 checksums
        run: |
          echo "MAC_SHA=$(sha256sum /tmp/jars/conload-mac.jar | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "LINUX_SHA=$(sha256sum /tmp/jars/conload-linux.jar | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Generate formula content from template
        run: |
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__MAC_SHA__/${MAC_SHA}/g" \
              -e "s/__LINUX_SHA__/${LINUX_SHA}/g" \
              Formula/conload.rb.template > /tmp/conload.rb
          cat /tmp/conload.rb
      - name: Push formula to soft-am/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/soft-am/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/conload.rb /tmp/tap/Formula/conload.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/conload.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(formula): bump conload to v${VERSION}"
          git push
